# ZAP baseline scan configuration (P17 task 11)
# Used by the CI 'zap' job: zap-baseline.py -t http://web:3000 -c baseline.conf -I -r zap-report.html
# Fails on Medium+ findings not listed in allowlist.tsv.

# Scan the storefront and admin via the web origin only.
# The API is private (no browser headers) and is NOT in scope for this baseline scan.
# ZAP noise about missing browser headers on the private API is documented in P17 §8.

# Authenticated context: the zap-baseline.py script is invoked with a session obtained
# via the test OTP hook (NODE_ENV=test reads OTP from a predictable source in the compose stack).

# Rules configuration
# ID | Action | Parameter | Value
# Action: IGNORE / WARN / FAIL / INFO
# Ref: https://www.zaproxy.org/docs/docker/baseline-scan/

# Content-Security-Policy — we emit CSP, so WARN if missing but FAIL if in enforce mode.
# The storefront and admin both emit CSP via the Next.js middleware.
10038	WARN	(Content Security Policy (CSP) Header Not Set)

# X-Content-Type-Options — emitted by the app.
10021	FAIL	(X-Content-Type-Options Header Missing)

# Strict-Transport-Security — emitted by the app; only effective once TLS is in place (Phase 2).
10035	WARN	(Strict-Transport-Security Header Not Set)

# X-Frame-Options — emitted by the app.
10020	FAIL	(Missing Anti-clickjacking Header)

# Server leakage — helmet removes Server and X-Powered-By.
10036	WARN	(Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s))

# Application error disclosure — no stack traces.
90022	FAIL	(Application Error Disclosure)

# SQL injection — parameterised queries only; this should never fire.
40018	FAIL	(SQL Injection)

# Reflected XSS — nonce CSP prevents execution; still track.
40012	FAIL	(Cross Site Scripting (Reflected))

# Stored XSS — sanitize-html allow-list; should never fire.
40014	FAIL	(Cross Site Scripting (Stored))

# Path traversal — schema validation prevents this.
6	FAIL	(Path Traversal)

# Remote file inclusion — not applicable; WARN to reduce noise.
7	WARN	(Remote File Inclusion)

# CSRF — BFF uses double-submit CSRF token; API is Bearer + JSON.
20012	WARN	(Anti-CSRF Tokens Scanner)
