name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pe/api db:generate
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pe/api db:generate
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pe/api db:generate
      - run: pnpm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pe
          POSTGRES_PASSWORD: pe
          POSTGRES_DB: pe_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pe/api db:generate
      - name: Migration drift check
        run: pnpm db:drift
        env:
          DATABASE_URL: postgresql://pe:pe@localhost:5432/pe_shadow
          SHADOW_DATABASE_URL: postgresql://pe:pe@localhost:5432/pe_shadow
      - name: Integration tests (Testcontainers)
        run: pnpm test:int
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: pe-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: pe-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Export images for scanning
        run: |
          docker save pe-api:ci -o /tmp/pe-api.tar
          docker save pe-web:ci -o /tmp/pe-web.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: /tmp/pe-*.tar
          retention-days: 1

  sast:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep (community rulesets)
        run: semgrep scan --config p/typescript --config p/nodejs --config p/owasp-top-ten --error --metrics=off
      - name: Semgrep (custom rules — P17)
        run: semgrep scan --config .semgrep/ --error --metrics=off

  security:
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/pe-api.tar
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy image scan (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/pe-web.tar
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  e2e:
    name: E2E (Chromium · Firefox · WebKit · mobile · tablet)
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - name: Load Docker images
        run: |
          docker load -i /tmp/pe-api.tar
          docker load -i /tmp/pe-web.tar
      - name: Start compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
        env:
          NODE_ENV: test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run @critical journeys (all browsers)
        run: |
          pnpm exec playwright test \
            --project=chromium --project=firefox --project=webkit \
            --project=mobile-chromium --project=tablet \
            --grep @critical
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
          MAILPIT_URL: http://localhost:8025
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      - name: Run remaining non-visual journeys (Chromium only)
        run: |
          pnpm exec playwright test \
            --project=chromium \
            --ignore-snapshots \
            --grep-invert @critical
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
          MAILPIT_URL: http://localhost:8025
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
        continue-on-error: true
      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  visual:
    name: Visual regression
    runs-on: ubuntu-24.04
    needs: [build]
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'visual')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - name: Load Docker images
        run: |
          docker load -i /tmp/pe-api.tar
          docker load -i /tmp/pe-web.tar
      - name: Start compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
        env:
          NODE_ENV: test
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run visual regression
        run: pnpm exec playwright test --project=visual
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
          MAILPIT_URL: http://localhost:8025
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    needs: [build]
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'visual')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g @lhci/cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - name: Load Docker images
        run: |
          docker load -i /tmp/pe-api.tar
          docker load -i /tmp/pe-web.tar
      - name: Start compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
        env:
          NODE_ENV: test
      - name: Run Lighthouse CI
        run: lhci autorun --config=tests/perf/lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: test-results/lighthouse/
          retention-days: 14

  zap:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - name: Load Docker images
        run: |
          docker load -i /tmp/pe-api.tar
          docker load -i /tmp/pe-web.tar
      - name: Start compose stack (e2e profile)
        run: |
          docker compose -f docker-compose.e2e.yml up -d --wait
        env:
          NODE_ENV: test
      - name: Wait for web to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "web is ready"
              break
            fi
            echo "waiting... ($i)"
            sleep 2
          done
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/baseline.conf'
          cmd_options: '-I -J zap-report.json -r zap-report.html'
          allow_issue_writing: false
          fail_action: false
      - name: Fail on FAIL-severity findings not in allowlist
        run: |
          node -e "
            const fs = require('fs');
            const allowlist = fs.readFileSync('.zap/allowlist.tsv', 'utf8')
              .trim().split('\n').slice(1)
              .map(l => l.split('\t')[0].trim());
            const report = JSON.parse(fs.readFileSync('zap-report.json', 'utf8'));
            const fails = (report.site || []).flatMap(s => s.alerts || [])
              .filter(a => a.riskcode >= 3 && !allowlist.includes(String(a.pluginid)));
            if (fails.length > 0) {
              console.error('ZAP FAIL findings not in allowlist:');
              fails.forEach(a => console.error(' -', a.pluginid, a.alert));
              process.exit(1);
            }
            console.log('ZAP: all high/critical findings are in allowlist or none found');
          "
      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json
          if-no-files-found: ignore
          retention-days: 14
