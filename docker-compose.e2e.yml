# Overlay that adds the two application containers with test-only settings for Playwright runs:
#   node scripts/generate-dev-env.mjs .env.e2e
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.e2e
    environment:
      NODE_ENV: test
      RATE_LIMIT_MULTIPLIER: '100'
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-pe}:${POSTGRES_PASSWORD:-pe}@postgres:5432/${POSTGRES_DB:-pe}
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_URL: smtp://mailpit:1025
      API_INTERNAL_URL: http://api:4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.e2e
    environment:
      NODE_ENV: test
      API_INTERNAL_URL: http://api:4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - api
