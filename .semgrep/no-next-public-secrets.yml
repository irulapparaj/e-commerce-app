rules:
  - id: no-next-public-secrets
    message: >
      NEXT_PUBLIC_* env variables are embedded in the client bundle and visible to all users.
      Secret-like names (key, secret, token, password, api_key, webhook) must never be
      exposed this way. Use server-only env vars instead.
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern: process.env.NEXT_PUBLIC_SECRET
      - pattern: process.env.NEXT_PUBLIC_KEY
      - pattern: process.env.NEXT_PUBLIC_TOKEN
      - pattern: process.env.NEXT_PUBLIC_PASSWORD
      - pattern: process.env.NEXT_PUBLIC_API_KEY
      - pattern: process.env.NEXT_PUBLIC_WEBHOOK
      - pattern: process.env.NEXT_PUBLIC_PRIVATE
    paths:
      include:
        - 'apps/web/**'
